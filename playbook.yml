---
- name: Prepare webservers
  hosts: all
  become: "{{ inventory_hostname != 'localhost' }}"

  tasks:
    - name: Install pip
      ansible.builtin.include_role:
        name: geerlingguy.pip
      tags: prepare
      when: inventory_hostname != "localhost"

    - name: Install Docker
      ansible.builtin.include_role:
        name: geerlingguy.docker
      tags: prepare
      when: inventory_hostname != "localhost"

- name: Deploy Redmine
  hosts: all
  become: "{{ inventory_hostname != 'localhost' }}"

  tasks:
    - name: Create Redmine directory
      ansible.builtin.file:
        path: /opt/redmine
        state: directory
        mode: "0755"
      tags: deploy
      when: inventory_hostname != "localhost"

    - name: Create Redmine env file
      ansible.builtin.template:
        src: templates/redmine.env.j2
        dest: "{{ redmine_env_file }}"
        mode: "0644"
      tags: deploy
      when: inventory_hostname != "localhost"

    - name: Run Redmine container
      community.docker.docker_container:
        name: "{{ redmine_container_name }}"
        image: "{{ redmine_image }}"
        state: started
        restart_policy: always
        pull: true
        recreate: true
        published_ports:
          - "{{ redmine_port }}:3000"
        env_file: "{{ redmine_env_file }}"
      tags: deploy
      when: inventory_hostname != "localhost"

- name: Configure Datadog monitoring
  hosts: webservers
  become: true

  roles:
    - role: datadog.dd.agent
      tags: monitoring
