- name: CI noop
  hosts: all
  gather_facts: false

  tasks:
    - name: Show CI message
      ansible.builtin.debug:
        msg: "Running in CI"
      when: inventory_hostname == "localhost"

- name: Prepare webservers
  hosts: webservers
  become: true

  roles:
    - role: geerlingguy.pip
      tags: prepare

    - role: geerlingguy.docker
      tags: prepare

- name: Deploy Redmine
  hosts: webservers
  become: true

  tasks:
    - name: Create Redmine directory
      ansible.builtin.file:
        path: /opt/redmine
        state: directory
        mode: "0755"
      tags: deploy

    - name: Create Redmine env file
      ansible.builtin.template:
        src: templates/redmine.env.j2
        dest: "{{ redmine_env_file }}"
        mode: "0644"
      tags: deploy

    - name: Run Redmine container
      community.docker.docker_container:
        name: "{{ redmine_container_name }}"
        image: "{{ redmine_image }}"
        state: started
        restart_policy: always
        pull: true
        recreate: true
        published_ports:
          - "{{ redmine_port }}:3000"
        env_file: "{{ redmine_env_file }}"
      tags: deploy

- name: Configure Datadog monitoring
  hosts: webservers
  become: true

  roles:
    - role: datadog.dd.agent
      tags: monitoring
